[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodh-research"
version = "0.1.0"
description = "Local research on media authenticity and human perception"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "matplotlib==3.8.4"]

[project.optional-dependencies]
pretrain = ["torch==2.2.2"]

[project.scripts]
bodh = "bodh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
